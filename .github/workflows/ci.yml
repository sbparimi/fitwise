name: Fitwise CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  build-and-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build frontend and Worker bundle
        run: ./build.sh
      - name: Run launch security and product contract tests
        run: node --test tests/*.test.mjs
      - name: Compile Python build scripts
        run: python -m py_compile build_pages.py build_front.py build_private.py
